<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Esraa 3D Cinematic Heart</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
overflow:hidden;
background:radial-gradient(circle at center,#0a0010,#000);
color:white;
}

/* UI screens */
.screen{
position:absolute;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
z-index:10;
}

.active{ display:flex; }

.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
padding:28px;
border-radius:22px;
box-shadow:0 0 35px rgba(255,0,150,0.25);
max-width:360px;
}

button{
margin-top:15px;
padding:12px 22px;
border:none;
border-radius:30px;
background:#ff2fa5;
color:white;
cursor:pointer;
font-size:15px;
box-shadow:0 0 20px #ff2fa5;
transition:0.3s;
}

button:hover{ transform:scale(1.08); }

/* name */
#name{
position:absolute;
width:100%;
text-align:center;
top:55%;
font-size:50px;
color:#ff6fd5;
text-shadow:0 0 25px #ff2fa5;
opacity:0;
transition:1.5s;
z-index:5;
}

/* canvas */
canvas{
position:absolute;
top:0;
left:0;
}

/* graph overlay */
#graph{
position:absolute;
top:0;
left:0;
z-index:2;
opacity:0.25;
}
</style>
</head>

<body>

<!-- UI -->
<div class="screen active" id="s1">
<div class="card">
<h1>💖 Esraa Cinematic Heart</h1>
<p>تجربة 3D سينمائية + رياضيات + مؤثرات</p>
<button onclick="go(2)">ابدأ</button>
</div>
</div>

<div class="screen" id="s2">
<div class="card">
<h1>🌌 تهيئة الكون</h1>
<p>جاري إنشاء النجوم والإحداثيات...</p>
<button onclick="initScene()">تشغيل</button>
</div>
</div>

<div class="screen" id="s3">
<div class="card">
<h1>💗 بناء القلب</h1>
<p>تفعيل الفيزياء + النبض + الرسم</p>
<button onclick="startHeart()">ابدأ الرسم</button>
</div>
</div>

<div class="screen" id="s4">
<div class="card">
<h1>🎀 النهاية</h1>
<p>تم اكتمال القلب</p>
<button onclick="location.reload()">إعادة</button>
</div>
</div>

<div id="name">إسراء</div>

<canvas id="graph"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene,camera,renderer,heart;
let particles=[];
let stars;
let t=0;
let explodeDone=false;

/* screens */
function go(id){
document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));
document.getElementById("s"+id).classList.add("active");
}

/* SCENE INIT */
function initScene(){

go(3);

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z = 28;

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xffffff,0.3));
let light = new THREE.PointLight(0xff4da6,2);
light.position.set(10,10,10);
scene.add(light);

/* STARS (particle system) */
let starGeo = new THREE.BufferGeometry();
let starCount = 1200;

let pos = [];

for(let i=0;i<starCount;i++){
pos.push(
( Math.random()-0.5)*200,
( Math.random()-0.5)*200,
( Math.random()-0.5)*200
);
}

starGeo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));

let starMat = new THREE.PointsMaterial({
color:0xffffff,
size:0.6,
transparent:true,
opacity:0.8
});

stars = new THREE.Points(starGeo,starMat);
scene.add(stars);

/* GRAPH GRID */
drawGraph();

animate();

}

/* GRAPH (real coordinate system) */
function drawGraph(){

let canvas = document.getElementById("graph");
let ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

function render(){

ctx.clearRect(0,0,canvas.width,canvas.height);

let w = canvas.width;
let h = canvas.height;

ctx.strokeStyle="rgba(255,255,255,0.2)";

/* grid */
for(let i=0;i<w;i+=40){
ctx.beginPath();
ctx.moveTo(i,0);
ctx.lineTo(i,h);
ctx.stroke();
}

for(let j=0;j<h;j+=40){
ctx.beginPath();
ctx.moveTo(0,j);
ctx.lineTo(w,j);
ctx.stroke();
}

/* axes */
ctx.strokeStyle="rgba(255,100,200,0.5)";
ctx.beginPath();
ctx.moveTo(w/2,0);
ctx.lineTo(w/2,h);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,h/2);
ctx.lineTo(w,h/2);
ctx.stroke();

requestAnimationFrame(render);
}

render();
}

/* HEART */
function startHeart(){

go(4);

/* heart shape */
let shape = new THREE.Shape();

for(let i=0;i<Math.PI*2;i+=0.02){

let x = 16*Math.pow(Math.sin(i),3);
let y = 13*Math.cos(i) - 5*Math.cos(2*i)
- 2*Math.cos(3*i) - Math.cos(4*i);

shape.lineTo(x*0.3,y*0.3);
}

let geo = new THREE.ShapeGeometry(shape);

let mat = new THREE.MeshPhongMaterial({
color:0xff2fa5,
emissive:0x550022,
side:THREE.DoubleSide
});

heart = new THREE.Mesh(geo,mat);
heart.scale.set(0,0,0);

scene.add(heart);

}

/* EXPLOSION */
function explode(){

if(explodeDone) return;
explodeDone=true;

for(let i=0;i<200;i++){

let geo = new THREE.SphereGeometry(0.2,6,6);
let mat = new THREE.MeshBasicMaterial({color:0xff4da6});

let p = new THREE.Mesh(geo,mat);

p.position.set(0,0,0);

scene.add(p);

particles.push({
mesh:p,
vx:(Math.random()-0.5)*0.3,
vy:(Math.random()-0.5)*0.3,
vz:(Math.random()-0.5)*0.3
});

}
}

/* ANIMATE */
function animate(){

requestAnimationFrame(animate);

/* stars motion */
if(stars){
stars.rotation.y += 0.0005;
}

/* camera cinematic orbit */
if(heart){
t += 0.01;

/* heartbeat physics */
let beat = 1 + Math.sin(t*3)*0.05;
heart.scale.set(beat,beat,beat);

/* rotation */
heart.rotation.y += 0.01;

/* cinematic camera orbit */
camera.position.x = Math.sin(t)*30;
camera.position.z = Math.cos(t)*30;
camera.lookAt(0,0,0);

/* trigger explosion */
if(beat > 1.04){
explode();
}
}

/* explosion update */
particles.forEach(p=>{
p.mesh.position.x += p.vx;
p.mesh.position.y += p.vy;
p.mesh.position.z += p.vz;
});

renderer.render(scene,camera);
}

/* resize */
window.addEventListener("resize",()=>{
camera.aspect = innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
