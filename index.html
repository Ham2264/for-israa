<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Esraa 3D Heart Journey</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
overflow:hidden;
background:radial-gradient(circle at center,#120018,#000);
color:white;
}

/* ===== SCREENS ===== */
.screen{
position:absolute;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
text-align:center;
flex-direction:column;
z-index:10;
}

.active{
display:flex;
}

.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
padding:30px;
border-radius:25px;
max-width:380px;
box-shadow:0 0 40px rgba(255,0,150,0.25);
}

/* BUTTON */
button{
margin-top:15px;
padding:12px 22px;
border:none;
border-radius:30px;
background:#ff2fa5;
color:white;
cursor:pointer;
font-size:15px;
box-shadow:0 0 20px #ff2fa5;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
}

/* NAME */
#name{
position:absolute;
top:55%;
width:100%;
text-align:center;
font-size:0px;
opacity:0;
color:#ff5fd2;
text-shadow:0 0 25px #ff2fa5,0 0 60px #ff2fa5;
transition:2s;
z-index:5;
}

/* CANVAS */
canvas{
position:absolute;
top:0;
left:0;
}

/* small hint */
.hint{
opacity:0.8;
font-size:14px;
margin-top:10px;
}
</style>
</head>

<body>

<!-- ===== STAGE 1 ===== -->
<div class="screen active" id="s1">
<div class="card">
<h1>💖 تجربة قلب إسراء</h1>
<p>رحلة 3D سينمائية + مراحل + مؤثرات</p>
<button onclick="go(2)">ابدأ</button>
</div>
</div>

<!-- ===== STAGE 2 ===== -->
<div class="screen" id="s2">
<div class="card">
<h1>🌌 المرحلة 1</h1>
<p>تهيئة الكون الثلاثي الأبعاد</p>
<div class="hint">جاري تحميل الإضاءة والنجوم...</div>
<button onclick="initScene()">تشغيل العالم</button>
</div>
</div>

<!-- ===== STAGE 3 ===== -->
<div class="screen" id="s3">
<div class="card">
<h1>💗 المرحلة 2</h1>
<p>تشكيل القلب الرياضي</p>
<div class="hint">سيبدأ الرسم الآن</div>
<button onclick="startHeart()">ابدأ الرسم</button>
</div>
</div>

<!-- ===== STAGE 4 ===== -->
<div class="screen" id="s4">
<div class="card">
<h1>🎀 النهاية</h1>
<p>تم اكتمال القلب بنجاح</p>
<button onclick="location.reload()">إعادة التجربة</button>
</div>
</div>

<div id="name">إسراء</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene, camera, renderer, heart;
let t = 0;
let readyName = false;

/* ===== NAV ===== */
function go(id){
document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));

document.getElementById("s"+id)
.classList.add("active");
}

/* ===== INIT WORLD ===== */
function initScene(){

go(3);

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
75, innerWidth/innerHeight, 0.1, 1000
);

camera.position.z = 28;

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xffffff,0.35));

let light = new THREE.PointLight(0xff4da6,2);
light.position.set(10,10,10);
scene.add(light);

/* START LOOP */
animate();

}

/* ===== HEART ===== */
function startHeart(){

go(4);

let shape = new THREE.Shape();

for(let i=0;i<Math.PI*2;i+=0.03){

let x = 16*Math.pow(Math.sin(i),3);
let y = 13*Math.cos(i) - 5*Math.cos(2*i)
- 2*Math.cos(3*i) - Math.cos(4*i);

shape.lineTo(x*0.3,y*0.3);
}

let geo = new THREE.ShapeGeometry(shape);

let mat = new THREE.MeshPhongMaterial({
color:0xff2fa5,
emissive:0x330011,
side:THREE.DoubleSide
});

heart = new THREE.Mesh(geo,mat);

/* يبدأ صغير */
heart.scale.set(0.01,0.01,0.01);

scene.add(heart);

}

/* ===== ANIMATION ===== */
function animate(){

requestAnimationFrame(animate);

t += 0.015;

/* heart build */
if(heart){

if(heart.scale.x < 1){
heart.scale.x += 0.015;
heart.scale.y += 0.015;
heart.scale.z += 0.015;
}

/* heartbeat physics */
let beat = 1 + Math.sin(t*4)*0.05;
heart.scale.set(beat,beat,beat);

/* rotation cinematic */
heart.rotation.y += 0.01;

/* camera orbit */
camera.position.x = Math.sin(t)*30;
camera.position.z = Math.cos(t)*30;
camera.lookAt(0,0,0);

/* light pulse */
scene.children.forEach(obj=>{
if(obj.isPointLight){
obj.intensity = 1.5 + Math.sin(t*3)*0.3;
}
});

/* NAME TRIGGER */
if(!readyName && beat > 1.03){
readyName = true;

let name = document.getElementById("name");

name.style.opacity = 1;
name.style.fontSize = "85px";
name.style.transform = "translateY(0px)";
}

}

renderer.render(scene,camera);

}

/* resize */
window.addEventListener("resize",()=>{
if(camera && renderer){
camera.aspect = innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
}
});

</script>

</body>
</html>
